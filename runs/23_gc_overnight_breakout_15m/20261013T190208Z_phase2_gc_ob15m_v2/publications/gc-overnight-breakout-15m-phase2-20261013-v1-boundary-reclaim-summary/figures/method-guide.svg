<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="2470" viewBox="0 0 1240 2470" font-family="Arial, sans-serif">
<title>Illustrative rule — Boundary reclaim</title><desc>Frozen range H / M / L; direction available at original breakout-candle close b. This is a process guide, not an observed price sample.</desc>
<rect width="100%" height="100%" fill="#fbfcf8"/>
<text x="40" y="55" font-size="31" fill="#24322d" text-anchor="start">Illustrative rule — Boundary reclaim</text>
<text x="40" y="94" font-size="21" fill="#24322d" text-anchor="start">Frozen range H / M / L; direction available at original breakout-candle close b. This is a</text><text x="40" y="121" font-size="21" fill="#24322d" text-anchor="start">process guide, not an observed price sample.</text>
<text x="40" y="160" font-size="27" fill="#246b61" text-anchor="start">Long / upper-first</text>
<rect x="40" y="185" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="58" y="216" font-size="24" fill="#24322d" text-anchor="start">Observe b close</text>
<text x="58" y="258" font-size="21" fill="#24322d" text-anchor="start">Direction becomes</text><text x="58" y="285" font-size="21" fill="#24322d" text-anchor="start">actionable. Observe</text><text x="58" y="312" font-size="21" fill="#24322d" text-anchor="start">the breakout without</text><text x="58" y="339" font-size="21" fill="#24322d" text-anchor="start">taking its original</text><text x="58" y="366" font-size="21" fill="#24322d" text-anchor="start">fill; no alternative</text><text x="58" y="393" font-size="21" fill="#24322d" text-anchor="start">fill on b.</text>
<path d="M315,305 H333" fill="none" stroke="#5d7169" stroke-width="3"/>
<path d="M331,299 L343,305 L331,311" fill="none" stroke="#5d7169" stroke-width="3"/>
<rect x="343" y="185" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="361" y="216" font-size="24" fill="#24322d" text-anchor="start">Arm at later j</text><text x="361" y="246" font-size="24" fill="#24322d" text-anchor="start">close</text>
<text x="361" y="288" font-size="21" fill="#24322d" text-anchor="start">First complete j &gt; b</text><text x="361" y="315" font-size="21" fill="#24322d" text-anchor="start">closes strictly below</text><text x="361" y="342" font-size="21" fill="#24322d" text-anchor="start">H. Preserve an</text><text x="361" y="369" font-size="21" fill="#24322d" text-anchor="start">uncertain prefix as</text><text x="361" y="396" font-size="21" fill="#24322d" text-anchor="start">unknown.</text>
<path d="M618,305 H636" fill="none" stroke="#5d7169" stroke-width="3"/>
<path d="M634,299 L646,305 L634,311" fill="none" stroke="#5d7169" stroke-width="3"/>
<rect x="646" y="185" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="664" y="216" font-size="24" fill="#24322d" text-anchor="start">Separate reclaim k</text>
<text x="664" y="258" font-size="21" fill="#24322d" text-anchor="start">First separate k &gt; j</text><text x="664" y="285" font-size="21" fill="#24322d" text-anchor="start">closes strictly above</text><text x="664" y="312" font-size="21" fill="#24322d" text-anchor="start">H − qW. Submit a</text><text x="664" y="339" font-size="21" fill="#24322d" text-anchor="start">market order at that</text><text x="664" y="366" font-size="21" fill="#24322d" text-anchor="start">close.</text>
<path d="M921,305 H939" fill="none" stroke="#5d7169" stroke-width="3"/>
<path d="M937,299 L949,305 L937,311" fill="none" stroke="#5d7169" stroke-width="3"/>
<rect x="949" y="185" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="967" y="216" font-size="24" fill="#24322d" text-anchor="start">Next eligible open</text>
<text x="967" y="258" font-size="21" fill="#24322d" text-anchor="start">Use actual next</text><text x="967" y="285" font-size="21" fill="#24322d" text-anchor="start">opening and retain</text><text x="967" y="312" font-size="21" fill="#24322d" text-anchor="start">gaps. Missing</text><text x="967" y="339" font-size="21" fill="#24322d" text-anchor="start">expected price is</text><text x="967" y="366" font-size="21" fill="#24322d" text-anchor="start">unknown; never fill</text><text x="967" y="393" font-size="21" fill="#24322d" text-anchor="start">at cutoff.</text>
<rect x="40" y="460" width="560" height="180" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="58" y="491" font-size="24" fill="#24322d" text-anchor="start">Initial stop: signal close</text>
<text x="58" y="533" font-size="21" fill="#24322d" text-anchor="start">The frozen percentage stop is based on the</text><text x="58" y="560" font-size="21" fill="#24322d" text-anchor="start">reclaim signal close and tick-rounded. It</text><text x="58" y="587" font-size="21" fill="#24322d" text-anchor="start">already protects the entry-candle path.</text>
<rect x="650" y="460" width="550" height="180" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="668" y="491" font-size="24" fill="#24322d" text-anchor="start">Reset only after survival</text>
<text x="668" y="533" font-size="21" fill="#24322d" text-anchor="start">At a surviving entry-candle close, reset once</text><text x="668" y="560" font-size="21" fill="#24322d" text-anchor="start">from actual slipped fill. A same-candle stop</text><text x="668" y="587" font-size="21" fill="#24322d" text-anchor="start">stays final; no target or trailing stop.</text>
<text x="40" y="675" font-size="27" fill="#a83d4d" text-anchor="start">Short / lower-first</text>
<rect x="40" y="700" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="58" y="731" font-size="24" fill="#24322d" text-anchor="start">Observe b close</text>
<text x="58" y="773" font-size="21" fill="#24322d" text-anchor="start">Direction becomes</text><text x="58" y="800" font-size="21" fill="#24322d" text-anchor="start">actionable. Observe</text><text x="58" y="827" font-size="21" fill="#24322d" text-anchor="start">the breakout without</text><text x="58" y="854" font-size="21" fill="#24322d" text-anchor="start">taking its original</text><text x="58" y="881" font-size="21" fill="#24322d" text-anchor="start">fill; no alternative</text><text x="58" y="908" font-size="21" fill="#24322d" text-anchor="start">fill on b.</text>
<path d="M315,820 H333" fill="none" stroke="#5d7169" stroke-width="3"/>
<path d="M331,814 L343,820 L331,826" fill="none" stroke="#5d7169" stroke-width="3"/>
<rect x="343" y="700" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="361" y="731" font-size="24" fill="#24322d" text-anchor="start">Arm at later j</text><text x="361" y="761" font-size="24" fill="#24322d" text-anchor="start">close</text>
<text x="361" y="803" font-size="21" fill="#24322d" text-anchor="start">First complete j &gt; b</text><text x="361" y="830" font-size="21" fill="#24322d" text-anchor="start">closes strictly above</text><text x="361" y="857" font-size="21" fill="#24322d" text-anchor="start">L. Preserve an</text><text x="361" y="884" font-size="21" fill="#24322d" text-anchor="start">uncertain prefix as</text><text x="361" y="911" font-size="21" fill="#24322d" text-anchor="start">unknown.</text>
<path d="M618,820 H636" fill="none" stroke="#5d7169" stroke-width="3"/>
<path d="M634,814 L646,820 L634,826" fill="none" stroke="#5d7169" stroke-width="3"/>
<rect x="646" y="700" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="664" y="731" font-size="24" fill="#24322d" text-anchor="start">Separate reclaim k</text>
<text x="664" y="773" font-size="21" fill="#24322d" text-anchor="start">First separate k &gt; j</text><text x="664" y="800" font-size="21" fill="#24322d" text-anchor="start">closes strictly below</text><text x="664" y="827" font-size="21" fill="#24322d" text-anchor="start">L + qW. Submit a</text><text x="664" y="854" font-size="21" fill="#24322d" text-anchor="start">market order at that</text><text x="664" y="881" font-size="21" fill="#24322d" text-anchor="start">close.</text>
<path d="M921,820 H939" fill="none" stroke="#5d7169" stroke-width="3"/>
<path d="M937,814 L949,820 L937,826" fill="none" stroke="#5d7169" stroke-width="3"/>
<rect x="949" y="700" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="967" y="731" font-size="24" fill="#24322d" text-anchor="start">Next eligible open</text>
<text x="967" y="773" font-size="21" fill="#24322d" text-anchor="start">Use actual next</text><text x="967" y="800" font-size="21" fill="#24322d" text-anchor="start">opening and retain</text><text x="967" y="827" font-size="21" fill="#24322d" text-anchor="start">gaps. Missing</text><text x="967" y="854" font-size="21" fill="#24322d" text-anchor="start">expected price is</text><text x="967" y="881" font-size="21" fill="#24322d" text-anchor="start">unknown; never fill</text><text x="967" y="908" font-size="21" fill="#24322d" text-anchor="start">at cutoff.</text>
<rect x="40" y="975" width="560" height="180" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="58" y="1006" font-size="24" fill="#24322d" text-anchor="start">Initial stop: signal close</text>
<text x="58" y="1048" font-size="21" fill="#24322d" text-anchor="start">The frozen percentage stop is based on the</text><text x="58" y="1075" font-size="21" fill="#24322d" text-anchor="start">reclaim signal close and tick-rounded. It</text><text x="58" y="1102" font-size="21" fill="#24322d" text-anchor="start">already protects the entry-candle path.</text>
<rect x="650" y="975" width="550" height="180" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="668" y="1006" font-size="24" fill="#24322d" text-anchor="start">Reset only after survival</text>
<text x="668" y="1048" font-size="21" fill="#24322d" text-anchor="start">At a surviving entry-candle close, reset once</text><text x="668" y="1075" font-size="21" fill="#24322d" text-anchor="start">from actual slipped fill. A same-candle stop</text><text x="668" y="1102" font-size="21" fill="#24322d" text-anchor="start">stays final; no target or trailing stop.</text>
<text x="40" y="1204" font-size="19" fill="#24322d" text-anchor="start">An opposite-boundary contact does not cancel this waiting percentage-stop policy. H10 and new filters are uncomputed.</text>
<text x="40" y="1325" font-size="25" fill="#24322d" text-anchor="start">Long / upper-first — illustrative normalized price/candle path</text>
<rect x="85" y="1425" width="1105" height="150" fill="#e8def4" opacity=".45"/>
<path d="M85,1425 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="1431" font-size="21" fill="#7950a0" text-anchor="start">H</text>
<path d="M85,1500.0 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="1506" font-size="21" fill="#7950a0" text-anchor="start">M</text>
<path d="M85,1575 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="1581" font-size="21" fill="#7950a0" text-anchor="start">L</text>
<path d="M85,1425 H1190" stroke="#386c92" stroke-width="2" stroke-dasharray="3 4" fill="none"/>
<text x="900" y="1417" font-size="17" fill="#386c92" text-anchor="start">H − qW (frozen interior level)</text>
<line x1="130" x2="130" y1="1385" y2="1462" stroke="#26764d" stroke-width="3"/>
<rect x="121" y="1397" width="18" height="53" fill="#26764d"/>
<line x1="300" x2="300" y1="1395" y2="1462" stroke="#bd5260" stroke-width="3"/>
<rect x="291" y="1407" width="18" height="43" fill="#bd5260"/>
<line x1="470" x2="470" y1="1389" y2="1454" stroke="#26764d" stroke-width="3"/>
<rect x="461" y="1401" width="18" height="41" fill="#26764d"/>
<line x1="640" x2="640" y1="1378" y2="1417" stroke="#26764d" stroke-width="3"/>
<rect x="631" y="1390" width="18" height="15" fill="#26764d"/>
<line x1="840" x2="840" y1="1378" y2="1404" stroke="#bd5260" stroke-width="3"/>
<rect x="831" y="1390" width="18" height="3" fill="#bd5260"/>
<line x1="1100" x2="1100" y1="1366" y2="1393" stroke="#bd5260" stroke-width="3"/>
<rect x="1091" y="1378" width="18" height="3" fill="#bd5260"/>
<polyline points="130,1397 300,1450 470,1401 640,1405 840,1390 1100,1378" stroke="#76847e" fill="none" stroke-width="2"/>
<circle cx="640" cy="1405" r="6" fill="#246b61" stroke="#fbfcf8" stroke-width="2"/>
<text x="640" y="1390" font-size="16" fill="#246b61" text-anchor="middle">BUY fill</text>
<path d="M640,1630 H840" fill="none" stroke="#b87936" stroke-width="3" stroke-dasharray="4 3"/>
<path d="M840,1615 H1100" fill="none" stroke="#a83d4d" stroke-width="3" stroke-dasharray="4 3"/>
<text x="650" y="1656" font-size="16" fill="#b87936" text-anchor="start">Initial % stop</text>
<text x="955" y="1641" font-size="16" fill="#a83d4d" text-anchor="start">Reset from actual fill</text>
<text x="130" y="1680" font-size="15" fill="#24322d" text-anchor="middle">b close available</text>
<text x="300" y="1680" font-size="15" fill="#24322d" text-anchor="middle">later j arms</text>
<text x="470" y="1680" font-size="15" fill="#24322d" text-anchor="middle">separate k signal</text>
<text x="640" y="1680" font-size="15" fill="#24322d" text-anchor="middle">next open fill</text>
<text x="840" y="1680" font-size="15" fill="#24322d" text-anchor="middle">surviving close</text>
<text x="1100" y="1680" font-size="15" fill="#24322d" text-anchor="middle">timed exit</text>
<text x="40" y="1715" font-size="19" fill="#24322d" text-anchor="start">j and k are separate later complete candles. Market entry follows k at the next scheduled eligible open; no</text><text x="40" y="1740" font-size="19" fill="#24322d" text-anchor="start">alternative fill on b.</text>
<text x="40" y="1773" font-size="18" fill="#24322d" text-anchor="start">Stops are separate from H/M/L. Reset only after entry-candle survival; a stop before that remains final. Original-</text><text x="40" y="1797" font-size="18" fill="#24322d" text-anchor="start">position status at a later signal is an account eligibility condition, never inferred from this schematic.</text>
<text x="40" y="1885" font-size="25" fill="#24322d" text-anchor="start">Short / lower-first — illustrative normalized price/candle path</text>
<rect x="85" y="1985" width="1105" height="150" fill="#e8def4" opacity=".45"/>
<path d="M85,1985 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="1991" font-size="21" fill="#7950a0" text-anchor="start">H</text>
<path d="M85,2060.0 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="2066" font-size="21" fill="#7950a0" text-anchor="start">M</text>
<path d="M85,2135 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="2141" font-size="21" fill="#7950a0" text-anchor="start">L</text>
<path d="M85,2135 H1190" stroke="#386c92" stroke-width="2" stroke-dasharray="3 4" fill="none"/>
<text x="900" y="2127" font-size="17" fill="#386c92" text-anchor="start">L + qW (frozen interior level)</text>
<line x1="130" x2="130" y1="2098" y2="2175" stroke="#bd5260" stroke-width="3"/>
<rect x="121" y="2110" width="18" height="53" fill="#bd5260"/>
<line x1="300" x2="300" y1="2098" y2="2165" stroke="#26764d" stroke-width="3"/>
<rect x="291" y="2110" width="18" height="43" fill="#26764d"/>
<line x1="470" x2="470" y1="2106" y2="2171" stroke="#bd5260" stroke-width="3"/>
<rect x="461" y="2118" width="18" height="41" fill="#bd5260"/>
<line x1="640" x2="640" y1="2143" y2="2182" stroke="#bd5260" stroke-width="3"/>
<rect x="631" y="2155" width="18" height="15" fill="#bd5260"/>
<line x1="840" x2="840" y1="2156" y2="2182" stroke="#26764d" stroke-width="3"/>
<rect x="831" y="2168" width="18" height="3" fill="#26764d"/>
<line x1="1100" x2="1100" y1="2167" y2="2194" stroke="#26764d" stroke-width="3"/>
<rect x="1091" y="2179" width="18" height="3" fill="#26764d"/>
<polyline points="130,2163 300,2110 470,2159 640,2155 840,2170 1100,2182" stroke="#76847e" fill="none" stroke-width="2"/>
<circle cx="640" cy="2155" r="6" fill="#246b61" stroke="#fbfcf8" stroke-width="2"/>
<text x="640" y="2185" font-size="16" fill="#246b61" text-anchor="middle">SELL fill</text>
<path d="M640,1930 H840" fill="none" stroke="#b87936" stroke-width="3" stroke-dasharray="4 3"/>
<path d="M840,1945 H1100" fill="none" stroke="#a83d4d" stroke-width="3" stroke-dasharray="4 3"/>
<text x="650" y="1920" font-size="16" fill="#b87936" text-anchor="start">Initial % stop</text>
<text x="955" y="1935" font-size="16" fill="#a83d4d" text-anchor="start">Reset from actual fill</text>
<text x="130" y="2240" font-size="15" fill="#24322d" text-anchor="middle">b close available</text>
<text x="300" y="2240" font-size="15" fill="#24322d" text-anchor="middle">later j arms</text>
<text x="470" y="2240" font-size="15" fill="#24322d" text-anchor="middle">separate k signal</text>
<text x="640" y="2240" font-size="15" fill="#24322d" text-anchor="middle">next open fill</text>
<text x="840" y="2240" font-size="15" fill="#24322d" text-anchor="middle">surviving close</text>
<text x="1100" y="2240" font-size="15" fill="#24322d" text-anchor="middle">timed exit</text>
<text x="40" y="2275" font-size="19" fill="#24322d" text-anchor="start">j and k are separate later complete candles. Market entry follows k at the next scheduled eligible open; no</text><text x="40" y="2300" font-size="19" fill="#24322d" text-anchor="start">alternative fill on b.</text>
<text x="40" y="2333" font-size="18" fill="#24322d" text-anchor="start">Stops are separate from H/M/L. Reset only after entry-candle survival; a stop before that remains final. Original-</text><text x="40" y="2357" font-size="18" fill="#24322d" text-anchor="start">position status at a later signal is an account eligibility condition, never inferred from this schematic.</text>
<text x="40" y="2450" font-size="18" fill="#24322d" text-anchor="start">Illustrative normalized geometry only; no observed prices, performance, exact tick scale or stop-distance scale.</text>
</svg>