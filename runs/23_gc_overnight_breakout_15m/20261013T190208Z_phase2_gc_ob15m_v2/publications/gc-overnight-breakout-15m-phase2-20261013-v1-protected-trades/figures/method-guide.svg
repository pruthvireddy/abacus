<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="2470" viewBox="0 0 1240 2470" font-family="Arial, sans-serif">
<title>Illustrative rules — protected overnight boundary</title><desc>Protected low L follows upper-first; protected high H mirrors lower-first. Observe after actual original fill, including after its exit.</desc>
<rect width="100%" height="100%" fill="#fbfcf8"/>
<text x="40" y="55" font-size="31" fill="#24322d" text-anchor="start">Illustrative rules — protected overnight boundary</text>
<text x="40" y="94" font-size="21" fill="#24322d" text-anchor="start">Protected low L follows upper-first; protected high H mirrors lower-first. Observe after actual</text><text x="40" y="121" font-size="21" fill="#24322d" text-anchor="start">original fill, including after its exit.</text>
<text x="40" y="175" font-size="27" fill="#24322d" text-anchor="start">Upper-first / protected low L</text>
<rect x="40" y="200" width="370" height="270" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="58" y="231" font-size="24" fill="#24322d" text-anchor="start">Touch and hold</text>
<text x="58" y="273" font-size="21" fill="#24322d" text-anchor="start">A later candle touches L and</text><text x="58" y="300" font-size="21" fill="#24322d" text-anchor="start">closes above L. No one-tick</text><text x="58" y="327" font-size="21" fill="#24322d" text-anchor="start">breach since original fill</text><text x="58" y="354" font-size="21" fill="#24322d" text-anchor="start">through this close. Buy next</text><text x="58" y="381" font-size="21" fill="#24322d" text-anchor="start">eligible open.</text>
<rect x="442" y="200" width="370" height="270" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="460" y="231" font-size="24" fill="#24322d" text-anchor="start">Failed break / reclaim</text>
<text x="460" y="273" font-size="21" fill="#24322d" text-anchor="start">First later one-tick breach</text><text x="460" y="300" font-size="21" fill="#24322d" text-anchor="start">arms at j close. A separate k</text><text x="460" y="327" font-size="21" fill="#24322d" text-anchor="start">&gt; j closes above L. Buy next</text><text x="460" y="354" font-size="21" fill="#24322d" text-anchor="start">eligible open.</text>
<rect x="844" y="200" width="370" height="270" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="862" y="231" font-size="24" fill="#24322d" text-anchor="start">Opposite reversal</text>
<text x="862" y="273" font-size="21" fill="#24322d" text-anchor="start">First later complete candle</text><text x="862" y="300" font-size="21" fill="#24322d" text-anchor="start">closes strictly below L. Sell</text><text x="862" y="327" font-size="21" fill="#24322d" text-anchor="start">next eligible open, opposite</text><text x="862" y="354" font-size="21" fill="#24322d" text-anchor="start">the original direction.</text>
<rect x="40" y="495" width="1160" height="135" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="58" y="526" font-size="24" fill="#24322d" text-anchor="start">Shared execution and separate occurrence evidence</text>
<text x="58" y="568" font-size="21" fill="#24322d" text-anchor="start">First setup only, later candles than b, initial signal-close stop and surviving-fill reset.</text><text x="58" y="595" font-size="21" fill="#24322d" text-anchor="start">Descriptive touch / breach / close-break / reclaim rates use two separate horizons and retain unknown</text><text x="58" y="622" font-size="21" fill="#24322d" text-anchor="start">exposure.</text>
<text x="40" y="690" font-size="27" fill="#24322d" text-anchor="start">Lower-first / protected high H</text>
<rect x="40" y="715" width="370" height="270" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="58" y="746" font-size="24" fill="#24322d" text-anchor="start">Touch and hold</text>
<text x="58" y="788" font-size="21" fill="#24322d" text-anchor="start">A later candle touches H and</text><text x="58" y="815" font-size="21" fill="#24322d" text-anchor="start">closes below H. No one-tick</text><text x="58" y="842" font-size="21" fill="#24322d" text-anchor="start">breach since original fill</text><text x="58" y="869" font-size="21" fill="#24322d" text-anchor="start">through this close. Sell next</text><text x="58" y="896" font-size="21" fill="#24322d" text-anchor="start">eligible open.</text>
<rect x="442" y="715" width="370" height="270" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="460" y="746" font-size="24" fill="#24322d" text-anchor="start">Failed break / reclaim</text>
<text x="460" y="788" font-size="21" fill="#24322d" text-anchor="start">First later one-tick breach</text><text x="460" y="815" font-size="21" fill="#24322d" text-anchor="start">arms at j close. A separate k</text><text x="460" y="842" font-size="21" fill="#24322d" text-anchor="start">&gt; j closes below H. Sell next</text><text x="460" y="869" font-size="21" fill="#24322d" text-anchor="start">eligible open.</text>
<rect x="844" y="715" width="370" height="270" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="862" y="746" font-size="24" fill="#24322d" text-anchor="start">Opposite reversal</text>
<text x="862" y="788" font-size="21" fill="#24322d" text-anchor="start">First later complete candle</text><text x="862" y="815" font-size="21" fill="#24322d" text-anchor="start">closes strictly above H. Buy</text><text x="862" y="842" font-size="21" fill="#24322d" text-anchor="start">next eligible open, opposite</text><text x="862" y="869" font-size="21" fill="#24322d" text-anchor="start">the original direction.</text>
<rect x="40" y="1010" width="1160" height="135" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="58" y="1041" font-size="24" fill="#24322d" text-anchor="start">Shared execution and separate occurrence evidence</text>
<text x="58" y="1083" font-size="21" fill="#24322d" text-anchor="start">First setup only, later candles than b, initial signal-close stop and surviving-fill reset.</text><text x="58" y="1110" font-size="21" fill="#24322d" text-anchor="start">Descriptive touch / breach / close-break / reclaim rates use two separate horizons and retain unknown</text><text x="58" y="1137" font-size="21" fill="#24322d" text-anchor="start">exposure.</text>
<text x="40" y="1210" font-size="19" fill="#24322d" text-anchor="start">The overnight boundary is neither a swing point nor necessarily the baseline&#x27;s active stop. All three policies are exploratory.</text>
<text x="40" y="1325" font-size="25" fill="#24322d" text-anchor="start">Upper-first / protected low — illustrative normalized price/candle path</text>
<rect x="85" y="1425" width="1105" height="150" fill="#e8def4" opacity=".45"/>
<path d="M85,1425 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="1431" font-size="21" fill="#7950a0" text-anchor="start">H</text>
<path d="M85,1500.0 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="1506" font-size="21" fill="#7950a0" text-anchor="start">M</text>
<path d="M85,1575 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="1581" font-size="21" fill="#7950a0" text-anchor="start">L</text>
<line x1="130" x2="130" y1="1385" y2="1465" stroke="#26764d" stroke-width="3"/>
<rect x="121" y="1397" width="18" height="56" fill="#26764d"/>
<line x1="270" x2="270" y1="1529" y2="1575" stroke="#bd5260" stroke-width="3"/>
<rect x="261" y="1537" width="18" height="16" fill="#bd5260"/>
<line x1="420" x2="420" y1="1543" y2="1600" stroke="#bd5260" stroke-width="3"/>
<rect x="411" y="1555" width="18" height="33" fill="#bd5260"/>
<line x1="650" x2="650" y1="1531" y2="1605" stroke="#26764d" stroke-width="3"/>
<rect x="641" y="1543" width="18" height="50" fill="#26764d"/>
<line x1="800" x2="800" y1="1529" y2="1559" stroke="#26764d" stroke-width="3"/>
<rect x="791" y="1541" width="18" height="6" fill="#26764d"/>
<line x1="940" x2="940" y1="1525" y2="1553" stroke="#26764d" stroke-width="3"/>
<rect x="931" y="1537" width="18" height="4" fill="#26764d"/>
<line x1="1100" x2="1100" y1="1518" y2="1545" stroke="#bd5260" stroke-width="3"/>
<rect x="1091" y="1530" width="18" height="3" fill="#bd5260"/>
<polyline points="130,1397 270,1553 340,1557 420,1588 500,1593 650,1543 800,1547 940,1537 1100,1530" stroke="#76847e" fill="none" stroke-width="2"/>
<circle cx="340" cy="1557" r="6" fill="#246b61" stroke="#fbfcf8" stroke-width="2"/>
<text x="340" y="1542" font-size="16" fill="#246b61" text-anchor="middle">Touch-hold BUY</text>
<circle cx="500" cy="1593" r="6" fill="#a83d4d" stroke="#fbfcf8" stroke-width="2"/>
<text x="500" y="1623" font-size="16" fill="#a83d4d" text-anchor="middle">Reversal SELL</text>
<circle cx="800" cy="1547" r="6" fill="#246b61" stroke="#fbfcf8" stroke-width="2"/>
<text x="800" y="1532" font-size="16" fill="#246b61" text-anchor="middle">Reclaim BUY</text>
<path d="M800,1630 H940" fill="none" stroke="#b87936" stroke-width="3" stroke-dasharray="4 3"/>
<path d="M940,1615 H1100" fill="none" stroke="#a83d4d" stroke-width="3" stroke-dasharray="4 3"/>
<text x="745" y="1656" font-size="16" fill="#b87936" text-anchor="start">Reclaim initial % stop</text>
<text x="955" y="1641" font-size="16" fill="#a83d4d" text-anchor="start">Reclaim reset from fill</text>
<text x="130" y="1680" font-size="15" fill="#24322d" text-anchor="middle">b close</text>
<text x="270" y="1680" font-size="15" fill="#24322d" text-anchor="middle">touch close</text>
<text x="420" y="1680" font-size="15" fill="#24322d" text-anchor="middle">breach j close</text>
<text x="650" y="1680" font-size="15" fill="#24322d" text-anchor="middle">separate k close</text>
<text x="800" y="1680" font-size="15" fill="#24322d" text-anchor="middle">next open</text>
<text x="940" y="1680" font-size="15" fill="#24322d" text-anchor="middle">entry close</text>
<text x="1100" y="1680" font-size="15" fill="#24322d" text-anchor="middle">timed exit</text>
<text x="40" y="1715" font-size="19" fill="#24322d" text-anchor="start">Boundary touch is distinct from a one-tick breach and a completed close beyond it. Each branch uses its own</text><text x="40" y="1740" font-size="19" fill="#24322d" text-anchor="start">next eligible open.</text>
<text x="40" y="1773" font-size="18" fill="#24322d" text-anchor="start">Stops are separate from H/M/L. Reset only after entry-candle survival; a stop before that remains final. Original-</text><text x="40" y="1797" font-size="18" fill="#24322d" text-anchor="start">position status at a later signal is an account eligibility condition, never inferred from this schematic.</text>
<text x="40" y="1885" font-size="25" fill="#24322d" text-anchor="start">Lower-first / protected high — illustrative normalized price/candle path</text>
<rect x="85" y="1985" width="1105" height="150" fill="#e8def4" opacity=".45"/>
<path d="M85,1985 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="1991" font-size="21" fill="#7950a0" text-anchor="start">H</text>
<path d="M85,2060.0 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="2066" font-size="21" fill="#7950a0" text-anchor="start">M</text>
<path d="M85,2135 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="2141" font-size="21" fill="#7950a0" text-anchor="start">L</text>
<line x1="130" x2="130" y1="2095" y2="2175" stroke="#bd5260" stroke-width="3"/>
<rect x="121" y="2107" width="18" height="56" fill="#bd5260"/>
<line x1="270" x2="270" y1="1985" y2="2031" stroke="#26764d" stroke-width="3"/>
<rect x="261" y="2007" width="18" height="16" fill="#26764d"/>
<line x1="420" x2="420" y1="1960" y2="2017" stroke="#26764d" stroke-width="3"/>
<rect x="411" y="1972" width="18" height="33" fill="#26764d"/>
<line x1="650" x2="650" y1="1955" y2="2029" stroke="#bd5260" stroke-width="3"/>
<rect x="641" y="1967" width="18" height="50" fill="#bd5260"/>
<line x1="800" x2="800" y1="2001" y2="2031" stroke="#bd5260" stroke-width="3"/>
<rect x="791" y="2013" width="18" height="6" fill="#bd5260"/>
<line x1="940" x2="940" y1="2007" y2="2035" stroke="#bd5260" stroke-width="3"/>
<rect x="931" y="2019" width="18" height="4" fill="#bd5260"/>
<line x1="1100" x2="1100" y1="2015" y2="2042" stroke="#26764d" stroke-width="3"/>
<rect x="1091" y="2027" width="18" height="3" fill="#26764d"/>
<polyline points="130,2163 270,2007 340,2003 420,1972 500,1967 650,2017 800,2013 940,2023 1100,2030" stroke="#76847e" fill="none" stroke-width="2"/>
<circle cx="340" cy="2003" r="6" fill="#246b61" stroke="#fbfcf8" stroke-width="2"/>
<text x="340" y="2033" font-size="16" fill="#246b61" text-anchor="middle">Touch-hold SELL</text>
<circle cx="500" cy="1967" r="6" fill="#a83d4d" stroke="#fbfcf8" stroke-width="2"/>
<text x="500" y="1952" font-size="16" fill="#a83d4d" text-anchor="middle">Reversal BUY</text>
<circle cx="800" cy="2013" r="6" fill="#246b61" stroke="#fbfcf8" stroke-width="2"/>
<text x="800" y="2043" font-size="16" fill="#246b61" text-anchor="middle">Reclaim SELL</text>
<path d="M800,1930 H940" fill="none" stroke="#b87936" stroke-width="3" stroke-dasharray="4 3"/>
<path d="M940,1945 H1100" fill="none" stroke="#a83d4d" stroke-width="3" stroke-dasharray="4 3"/>
<text x="745" y="1920" font-size="16" fill="#b87936" text-anchor="start">Reclaim initial % stop</text>
<text x="955" y="1935" font-size="16" fill="#a83d4d" text-anchor="start">Reclaim reset from fill</text>
<text x="130" y="2240" font-size="15" fill="#24322d" text-anchor="middle">b close</text>
<text x="270" y="2240" font-size="15" fill="#24322d" text-anchor="middle">touch close</text>
<text x="420" y="2240" font-size="15" fill="#24322d" text-anchor="middle">breach j close</text>
<text x="650" y="2240" font-size="15" fill="#24322d" text-anchor="middle">separate k close</text>
<text x="800" y="2240" font-size="15" fill="#24322d" text-anchor="middle">next open</text>
<text x="940" y="2240" font-size="15" fill="#24322d" text-anchor="middle">entry close</text>
<text x="1100" y="2240" font-size="15" fill="#24322d" text-anchor="middle">timed exit</text>
<text x="40" y="2275" font-size="19" fill="#24322d" text-anchor="start">Boundary touch is distinct from a one-tick breach and a completed close beyond it. Each branch uses its own</text><text x="40" y="2300" font-size="19" fill="#24322d" text-anchor="start">next eligible open.</text>
<text x="40" y="2333" font-size="18" fill="#24322d" text-anchor="start">Stops are separate from H/M/L. Reset only after entry-candle survival; a stop before that remains final. Original-</text><text x="40" y="2357" font-size="18" fill="#24322d" text-anchor="start">position status at a later signal is an account eligibility condition, never inferred from this schematic.</text>
<text x="40" y="2450" font-size="18" fill="#24322d" text-anchor="start">Illustrative normalized geometry only; no observed prices, performance, exact tick scale or stop-distance scale.</text>
</svg>