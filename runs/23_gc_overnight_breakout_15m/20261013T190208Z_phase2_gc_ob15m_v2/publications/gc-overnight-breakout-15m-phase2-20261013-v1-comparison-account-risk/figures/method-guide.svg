<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1170" viewBox="0 0 1240 1170" font-family="Arial, sans-serif">
<title>Illustrative distinction — price and financial recovery</title><desc>A return to a range level is a path diagnostic. Financial recovery requires genuinely executed legs and both legs&#x27; costs.</desc>
<rect width="100%" height="100%" fill="#fbfcf8"/>
<text x="40" y="55" font-size="31" fill="#24322d" text-anchor="start">Illustrative distinction — price and financial recovery</text>
<text x="40" y="94" font-size="21" fill="#24322d" text-anchor="start">A return to a range level is a path diagnostic. Financial recovery requires genuinely executed</text><text x="40" y="121" font-size="21" fill="#24322d" text-anchor="start">legs and both legs&#x27; costs.</text>
<text x="40" y="184" font-size="27" fill="#24322d" text-anchor="start">Price recovery after a protected breach</text>
<rect x="40" y="215" width="560" height="190" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="58" y="246" font-size="24" fill="#24322d" text-anchor="start">Touches and later close reclaims</text>
<text x="58" y="288" font-size="21" fill="#24322d" text-anchor="start">Track breached boundary → midpoint → original</text><text x="58" y="315" font-size="21" fill="#24322d" text-anchor="start">boundary. Keep unknown order, gaps, cutoff and</text><text x="58" y="342" font-size="21" fill="#24322d" text-anchor="start">actual event sessions.</text>
<rect x="650" y="215" width="550" height="190" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="668" y="246" font-size="24" fill="#24322d" text-anchor="start">No automatic trade success</text>
<text x="668" y="288" font-size="21" fill="#24322d" text-anchor="start">A level reached before entry is not an</text><text x="668" y="315" font-size="21" fill="#24322d" text-anchor="start">executed target. Price recovery does not</text><text x="668" y="342" font-size="21" fill="#24322d" text-anchor="start">establish positive net P&amp;L.</text>
<text x="40" y="474" font-size="27" fill="#24322d" text-anchor="start">Executed financial recovery after a realized loss</text>
<rect x="40" y="510" width="370" height="270" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="58" y="541" font-size="24" fill="#24322d" text-anchor="start">Loss known at signal</text>
<text x="58" y="583" font-size="21" fill="#24322d" text-anchor="start">Original leg is flat; its net</text><text x="58" y="610" font-size="21" fill="#24322d" text-anchor="start">loss is realized and known.</text><text x="58" y="637" font-size="21" fill="#24322d" text-anchor="start">Skip an ineligible first</text><text x="58" y="664" font-size="21" fill="#24322d" text-anchor="start">signal without a later</text><text x="58" y="691" font-size="21" fill="#24322d" text-anchor="start">attempt.</text>
<path d="M410,645 H432" fill="none" stroke="#5d7169" stroke-width="3"/>
<path d="M430,639 L442,645 L430,651" fill="none" stroke="#5d7169" stroke-width="3"/>
<rect x="442" y="510" width="370" height="270" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="460" y="541" font-size="24" fill="#24322d" text-anchor="start">Feasible whole GC</text>
<text x="460" y="583" font-size="21" fill="#24322d" text-anchor="start">Split the daily budget before</text><text x="460" y="610" font-size="21" fill="#24322d" text-anchor="start">entry. Apply risk, leverage,</text><text x="460" y="637" font-size="21" fill="#24322d" text-anchor="start">margin, costs and whole-</text><text x="460" y="664" font-size="21" fill="#24322d" text-anchor="start">contract limits; no</text><text x="460" y="691" font-size="21" fill="#24322d" text-anchor="start">replenishment.</text>
<path d="M812,645 H834" fill="none" stroke="#5d7169" stroke-width="3"/>
<path d="M832,639 L844,645 L832,651" fill="none" stroke="#5d7169" stroke-width="3"/>
<rect x="844" y="510" width="370" height="270" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="862" y="541" font-size="24" fill="#24322d" text-anchor="start">Actual later leg</text>
<text x="862" y="583" font-size="21" fill="#24322d" text-anchor="start">Require a genuine eligible</text><text x="862" y="610" font-size="21" fill="#24322d" text-anchor="start">fill. Opposite signals while</text><text x="862" y="637" font-size="21" fill="#24322d" text-anchor="start">the original is open are not</text><text x="862" y="664" font-size="21" fill="#24322d" text-anchor="start">an automatic hedge or</text><text x="862" y="691" font-size="21" fill="#24322d" text-anchor="start">reversal.</text>
<rect x="40" y="835" width="1160" height="205" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="58" y="866" font-size="24" fill="#24322d" text-anchor="start">Saved combined net outcome after both costs</text>
<text x="58" y="908" font-size="21" fill="#24322d" text-anchor="start">Full recovery: combined net P&amp;L is nonnegative. Partial improvement remains negative but improves the</text><text x="58" y="935" font-size="21" fill="#24322d" text-anchor="start">original realized loss; no improvement and further loss stay distinct. If quantity is infeasible, show</text><text x="58" y="962" font-size="21" fill="#24322d" text-anchor="start">skips, no actual fills and unavailable recovery rates.</text>
<text x="40" y="1125" font-size="20" fill="#24322d" text-anchor="start">Illustrative eligibility/accounting logic only. Standardized replacement profits are not source-account returns.</text>
</svg>