<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="2470" viewBox="0 0 1240 2470" font-family="Arial, sans-serif">
<title>Illustrative rule — passive interior limits</title><desc>Passive limits and confirmed reclaims answer different execution questions. No hindsight order or pooling of their outcomes.</desc>
<rect width="100%" height="100%" fill="#fbfcf8"/>
<text x="40" y="55" font-size="31" fill="#24322d" text-anchor="start">Illustrative rule — passive interior limits</text>
<text x="40" y="94" font-size="21" fill="#24322d" text-anchor="start">Passive limits and confirmed reclaims answer different execution questions. No hindsight order</text><text x="40" y="121" font-size="21" fill="#24322d" text-anchor="start">or pooling of their outcomes.</text>
<text x="40" y="160" font-size="27" fill="#246b61" text-anchor="start">Long / upper-first</text>
<rect x="40" y="185" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="58" y="216" font-size="24" fill="#24322d" text-anchor="start">Confirm b close</text>
<text x="58" y="258" font-size="21" fill="#24322d" text-anchor="start">Freeze the raw</text><text x="58" y="285" font-size="21" fill="#24322d" text-anchor="start">quarter, midpoint or</text><text x="58" y="312" font-size="21" fill="#24322d" text-anchor="start">three-quarter level.</text><text x="58" y="339" font-size="21" fill="#24322d" text-anchor="start">Activate only after</text><text x="58" y="366" font-size="21" fill="#24322d" text-anchor="start">the complete original</text><text x="58" y="393" font-size="21" fill="#24322d" text-anchor="start">breakout candle.</text>
<path d="M315,305 H333" fill="none" stroke="#5d7169" stroke-width="3"/>
<path d="M331,299 L343,305 L331,311" fill="none" stroke="#5d7169" stroke-width="3"/>
<rect x="343" y="185" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="361" y="216" font-size="24" fill="#24322d" text-anchor="start">Check known</text><text x="361" y="246" font-size="24" fill="#24322d" text-anchor="start">history</text>
<text x="361" y="288" font-size="21" fill="#24322d" text-anchor="start">Skip a level reached</text><text x="361" y="315" font-size="21" fill="#24322d" text-anchor="start">in the known post-</text><text x="361" y="342" font-size="21" fill="#24322d" text-anchor="start">original-fill path</text><text x="361" y="369" font-size="21" fill="#24322d" text-anchor="start">before submission. An</text><text x="361" y="396" font-size="21" fill="#24322d" text-anchor="start">ambiguous prefix</text><text x="361" y="423" font-size="21" fill="#24322d" text-anchor="start">stays unknown.</text>
<path d="M618,305 H636" fill="none" stroke="#5d7169" stroke-width="3"/>
<path d="M634,299 L646,305 L634,311" fill="none" stroke="#5d7169" stroke-width="3"/>
<rect x="646" y="185" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="664" y="216" font-size="24" fill="#24322d" text-anchor="start">Submit executable</text><text x="664" y="246" font-size="24" fill="#24322d" text-anchor="start">limit</text>
<text x="664" y="288" font-size="21" fill="#24322d" text-anchor="start">Round inward: floor a</text><text x="664" y="315" font-size="21" fill="#24322d" text-anchor="start">buy to the tick.</text><text x="664" y="342" font-size="21" fill="#24322d" text-anchor="start">Retain the raw level</text><text x="664" y="369" font-size="21" fill="#24322d" text-anchor="start">separately.</text>
<path d="M921,305 H939" fill="none" stroke="#5d7169" stroke-width="3"/>
<path d="M937,299 L949,305 L937,311" fill="none" stroke="#5d7169" stroke-width="3"/>
<rect x="949" y="185" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="967" y="216" font-size="24" fill="#24322d" text-anchor="start">Opening / intrabar</text><text x="967" y="246" font-size="24" fill="#24322d" text-anchor="start">fill</text>
<text x="967" y="288" font-size="21" fill="#24322d" text-anchor="start">Keep favorable gaps.</text><text x="967" y="315" font-size="21" fill="#24322d" text-anchor="start">Intrabar fill needs</text><text x="967" y="342" font-size="21" fill="#24322d" text-anchor="start">one tick through the</text><text x="967" y="369" font-size="21" fill="#24322d" text-anchor="start">limit. Touch-only is</text><text x="967" y="396" font-size="21" fill="#24322d" text-anchor="start">a sensitivity.</text>
<rect x="40" y="460" width="560" height="180" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="58" y="491" font-size="24" fill="#24322d" text-anchor="start">Initial stop: submitted limit</text>
<text x="58" y="533" font-size="21" fill="#24322d" text-anchor="start">Attach the frozen percentage stop from the</text><text x="58" y="560" font-size="21" fill="#24322d" text-anchor="start">executable limit. Preserve an opening gap</text><text x="58" y="587" font-size="21" fill="#24322d" text-anchor="start">through its stop and resulting protective exit.</text>
<rect x="650" y="460" width="550" height="180" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="668" y="491" font-size="24" fill="#24322d" text-anchor="start">Survival, reset and cutoff</text>
<text x="668" y="533" font-size="21" fill="#24322d" text-anchor="start">Only a surviving entry candle resets from</text><text x="668" y="560" font-size="21" fill="#24322d" text-anchor="start">actual slipped fill. Expire unfilled orders at</text><text x="668" y="587" font-size="21" fill="#24322d" text-anchor="start">cutoff and use the inherited timed exit.</text>
<text x="40" y="670" font-size="27" fill="#a83d4d" text-anchor="start">Short / lower-first</text>
<rect x="40" y="695" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="58" y="726" font-size="24" fill="#24322d" text-anchor="start">Confirm b close</text>
<text x="58" y="768" font-size="21" fill="#24322d" text-anchor="start">Freeze the raw</text><text x="58" y="795" font-size="21" fill="#24322d" text-anchor="start">quarter, midpoint or</text><text x="58" y="822" font-size="21" fill="#24322d" text-anchor="start">three-quarter level.</text><text x="58" y="849" font-size="21" fill="#24322d" text-anchor="start">Activate only after</text><text x="58" y="876" font-size="21" fill="#24322d" text-anchor="start">the complete original</text><text x="58" y="903" font-size="21" fill="#24322d" text-anchor="start">breakout candle.</text>
<path d="M315,815 H333" fill="none" stroke="#5d7169" stroke-width="3"/>
<path d="M331,809 L343,815 L331,821" fill="none" stroke="#5d7169" stroke-width="3"/>
<rect x="343" y="695" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="361" y="726" font-size="24" fill="#24322d" text-anchor="start">Check known</text><text x="361" y="756" font-size="24" fill="#24322d" text-anchor="start">history</text>
<text x="361" y="798" font-size="21" fill="#24322d" text-anchor="start">Skip a level reached</text><text x="361" y="825" font-size="21" fill="#24322d" text-anchor="start">in the known post-</text><text x="361" y="852" font-size="21" fill="#24322d" text-anchor="start">original-fill path</text><text x="361" y="879" font-size="21" fill="#24322d" text-anchor="start">before submission. An</text><text x="361" y="906" font-size="21" fill="#24322d" text-anchor="start">ambiguous prefix</text><text x="361" y="933" font-size="21" fill="#24322d" text-anchor="start">stays unknown.</text>
<path d="M618,815 H636" fill="none" stroke="#5d7169" stroke-width="3"/>
<path d="M634,809 L646,815 L634,821" fill="none" stroke="#5d7169" stroke-width="3"/>
<rect x="646" y="695" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="664" y="726" font-size="24" fill="#24322d" text-anchor="start">Submit executable</text><text x="664" y="756" font-size="24" fill="#24322d" text-anchor="start">limit</text>
<text x="664" y="798" font-size="21" fill="#24322d" text-anchor="start">Round inward: ceil a</text><text x="664" y="825" font-size="21" fill="#24322d" text-anchor="start">sell to the tick.</text><text x="664" y="852" font-size="21" fill="#24322d" text-anchor="start">Retain the raw level</text><text x="664" y="879" font-size="21" fill="#24322d" text-anchor="start">separately.</text>
<path d="M921,815 H939" fill="none" stroke="#5d7169" stroke-width="3"/>
<path d="M937,809 L949,815 L937,821" fill="none" stroke="#5d7169" stroke-width="3"/>
<rect x="949" y="695" width="275" height="250" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="967" y="726" font-size="24" fill="#24322d" text-anchor="start">Opening / intrabar</text><text x="967" y="756" font-size="24" fill="#24322d" text-anchor="start">fill</text>
<text x="967" y="798" font-size="21" fill="#24322d" text-anchor="start">Keep favorable gaps.</text><text x="967" y="825" font-size="21" fill="#24322d" text-anchor="start">Intrabar fill needs</text><text x="967" y="852" font-size="21" fill="#24322d" text-anchor="start">one tick through the</text><text x="967" y="879" font-size="21" fill="#24322d" text-anchor="start">limit. Touch-only is</text><text x="967" y="906" font-size="21" fill="#24322d" text-anchor="start">a sensitivity.</text>
<rect x="40" y="970" width="560" height="180" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="58" y="1001" font-size="24" fill="#24322d" text-anchor="start">Initial stop: submitted limit</text>
<text x="58" y="1043" font-size="21" fill="#24322d" text-anchor="start">Attach the frozen percentage stop from the</text><text x="58" y="1070" font-size="21" fill="#24322d" text-anchor="start">executable limit. Preserve an opening gap</text><text x="58" y="1097" font-size="21" fill="#24322d" text-anchor="start">through its stop and resulting protective exit.</text>
<rect x="650" y="970" width="550" height="180" rx="9" fill="#f4f0fa" stroke="#6952a3" stroke-width="2"/>
<text x="668" y="1001" font-size="24" fill="#24322d" text-anchor="start">Survival, reset and cutoff</text>
<text x="668" y="1043" font-size="21" fill="#24322d" text-anchor="start">Only a surviving entry candle resets from</text><text x="668" y="1070" font-size="21" fill="#24322d" text-anchor="start">actual slipped fill. Expire unfilled orders at</text><text x="668" y="1097" font-size="21" fill="#24322d" text-anchor="start">cutoff and use the inherited timed exit.</text>
<text x="40" y="1193" font-size="20" fill="#24322d" text-anchor="start">Illustrative order-state timeline only; it does not assert a tick-exact price path, observed fill or financial return.</text>
<text x="40" y="1325" font-size="25" fill="#24322d" text-anchor="start">Long / upper-first — illustrative normalized price/candle path</text>
<rect x="85" y="1425" width="1105" height="150" fill="#e8def4" opacity=".45"/>
<path d="M85,1425 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="1431" font-size="21" fill="#7950a0" text-anchor="start">H</text>
<path d="M85,1500.0 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="1506" font-size="21" fill="#7950a0" text-anchor="start">M</text>
<path d="M85,1575 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="1581" font-size="21" fill="#7950a0" text-anchor="start">L</text>
<path d="M85,1500 H1190" stroke="#386c92" stroke-width="2" stroke-dasharray="3 4" fill="none"/>
<text x="900" y="1492" font-size="17" fill="#386c92" text-anchor="start">H − qW (frozen interior level)</text>
<line x1="130" x2="130" y1="1385" y2="1462" stroke="#26764d" stroke-width="3"/>
<rect x="121" y="1397" width="18" height="53" fill="#26764d"/>
<line x1="300" x2="300" y1="1460" y2="1500" stroke="#bd5260" stroke-width="3"/>
<rect x="291" y="1468" width="18" height="10" fill="#bd5260"/>
<line x1="470" x2="470" y1="1473" y2="1526" stroke="#bd5260" stroke-width="3"/>
<rect x="461" y="1485" width="18" height="29" fill="#bd5260"/>
<line x1="640" x2="640" y1="1471" y2="1520" stroke="#26764d" stroke-width="3"/>
<rect x="631" y="1483" width="18" height="25" fill="#26764d"/>
<line x1="840" x2="840" y1="1465" y2="1495" stroke="#26764d" stroke-width="3"/>
<rect x="831" y="1477" width="18" height="6" fill="#26764d"/>
<line x1="1100" x2="1100" y1="1450" y2="1478" stroke="#bd5260" stroke-width="3"/>
<rect x="1091" y="1462" width="18" height="4" fill="#bd5260"/>
<polyline points="130,1397 300,1478 470,1514 640,1508 840,1483 1100,1462" stroke="#76847e" fill="none" stroke-width="2"/>
<circle cx="640" cy="1508" r="6" fill="#246b61" stroke="#fbfcf8" stroke-width="2"/>
<text x="640" y="1493" font-size="16" fill="#246b61" text-anchor="middle">BUY fill</text>
<path d="M640,1630 H840" fill="none" stroke="#b87936" stroke-width="3" stroke-dasharray="4 3"/>
<path d="M840,1615 H1100" fill="none" stroke="#a83d4d" stroke-width="3" stroke-dasharray="4 3"/>
<text x="650" y="1656" font-size="16" fill="#b87936" text-anchor="start">Initial % stop</text>
<text x="955" y="1641" font-size="16" fill="#a83d4d" text-anchor="start">Reset from actual fill</text>
<text x="130" y="1680" font-size="15" fill="#24322d" text-anchor="middle">b close: activate</text>
<text x="300" y="1680" font-size="15" fill="#24322d" text-anchor="middle">touch only</text>
<text x="470" y="1680" font-size="15" fill="#24322d" text-anchor="middle">one tick through</text>
<text x="640" y="1680" font-size="15" fill="#24322d" text-anchor="middle">opening-gap branch</text>
<text x="840" y="1680" font-size="15" fill="#24322d" text-anchor="middle">surviving close</text>
<text x="1100" y="1680" font-size="15" fill="#24322d" text-anchor="middle">timed exit</text>
<text x="40" y="1715" font-size="19" fill="#24322d" text-anchor="start">Touch alone does not fill the primary intrabar model. Trade-through and favorable opening gaps are distinct</text><text x="40" y="1740" font-size="19" fill="#24322d" text-anchor="start">alternatives, not consecutive fills.</text>
<text x="40" y="1773" font-size="18" fill="#24322d" text-anchor="start">Stops are separate from H/M/L. Reset only after entry-candle survival; a stop before that remains final. Original-</text><text x="40" y="1797" font-size="18" fill="#24322d" text-anchor="start">position status at a later signal is an account eligibility condition, never inferred from this schematic.</text>
<text x="40" y="1885" font-size="25" fill="#24322d" text-anchor="start">Short / lower-first — illustrative normalized price/candle path</text>
<rect x="85" y="1985" width="1105" height="150" fill="#e8def4" opacity=".45"/>
<path d="M85,1985 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="1991" font-size="21" fill="#7950a0" text-anchor="start">H</text>
<path d="M85,2060.0 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="2066" font-size="21" fill="#7950a0" text-anchor="start">M</text>
<path d="M85,2135 H1190" stroke="#8f62bb" stroke-dasharray="7 5" fill="none"/>
<text x="45" y="2141" font-size="21" fill="#7950a0" text-anchor="start">L</text>
<path d="M85,2060 H1190" stroke="#386c92" stroke-width="2" stroke-dasharray="3 4" fill="none"/>
<text x="900" y="2052" font-size="17" fill="#386c92" text-anchor="start">L + qW (frozen interior level)</text>
<line x1="130" x2="130" y1="2098" y2="2175" stroke="#bd5260" stroke-width="3"/>
<rect x="121" y="2110" width="18" height="53" fill="#bd5260"/>
<line x1="300" x2="300" y1="2060" y2="2100" stroke="#26764d" stroke-width="3"/>
<rect x="291" y="2082" width="18" height="10" fill="#26764d"/>
<line x1="470" x2="470" y1="2034" y2="2087" stroke="#26764d" stroke-width="3"/>
<rect x="461" y="2046" width="18" height="29" fill="#26764d"/>
<line x1="640" x2="640" y1="2040" y2="2089" stroke="#bd5260" stroke-width="3"/>
<rect x="631" y="2052" width="18" height="25" fill="#bd5260"/>
<line x1="840" x2="840" y1="2065" y2="2095" stroke="#bd5260" stroke-width="3"/>
<rect x="831" y="2077" width="18" height="6" fill="#bd5260"/>
<line x1="1100" x2="1100" y1="2082" y2="2110" stroke="#26764d" stroke-width="3"/>
<rect x="1091" y="2094" width="18" height="4" fill="#26764d"/>
<polyline points="130,2163 300,2082 470,2046 640,2052 840,2077 1100,2098" stroke="#76847e" fill="none" stroke-width="2"/>
<circle cx="640" cy="2052" r="6" fill="#246b61" stroke="#fbfcf8" stroke-width="2"/>
<text x="640" y="2082" font-size="16" fill="#246b61" text-anchor="middle">SELL fill</text>
<path d="M640,1930 H840" fill="none" stroke="#b87936" stroke-width="3" stroke-dasharray="4 3"/>
<path d="M840,1945 H1100" fill="none" stroke="#a83d4d" stroke-width="3" stroke-dasharray="4 3"/>
<text x="650" y="1920" font-size="16" fill="#b87936" text-anchor="start">Initial % stop</text>
<text x="955" y="1935" font-size="16" fill="#a83d4d" text-anchor="start">Reset from actual fill</text>
<text x="130" y="2240" font-size="15" fill="#24322d" text-anchor="middle">b close: activate</text>
<text x="300" y="2240" font-size="15" fill="#24322d" text-anchor="middle">touch only</text>
<text x="470" y="2240" font-size="15" fill="#24322d" text-anchor="middle">one tick through</text>
<text x="640" y="2240" font-size="15" fill="#24322d" text-anchor="middle">opening-gap branch</text>
<text x="840" y="2240" font-size="15" fill="#24322d" text-anchor="middle">surviving close</text>
<text x="1100" y="2240" font-size="15" fill="#24322d" text-anchor="middle">timed exit</text>
<text x="40" y="2275" font-size="19" fill="#24322d" text-anchor="start">Touch alone does not fill the primary intrabar model. Trade-through and favorable opening gaps are distinct</text><text x="40" y="2300" font-size="19" fill="#24322d" text-anchor="start">alternatives, not consecutive fills.</text>
<text x="40" y="2333" font-size="18" fill="#24322d" text-anchor="start">Stops are separate from H/M/L. Reset only after entry-candle survival; a stop before that remains final. Original-</text><text x="40" y="2357" font-size="18" fill="#24322d" text-anchor="start">position status at a later signal is an account eligibility condition, never inferred from this schematic.</text>
<text x="40" y="2450" font-size="18" fill="#24322d" text-anchor="start">Illustrative normalized geometry only; no observed prices, performance, exact tick scale or stop-distance scale.</text>
</svg>