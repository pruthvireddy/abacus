# Copy to paths.local.toml. Local paths are ignored by Git.
# Relative values resolve from the Abacus workspace root.
# The consolidated workspace contains BOTH catalog/ and data/.
# Restore ignored bulk storage separately when setting up another machine.
[paths]
publication_root = "."
legacy_research_root = "legacy/sahadeva"

# Optional overrides: ABACUS_WORKSPACE_ROOT, ABACUS_PUBLICATION_ROOT,
# ABACUS_LEGACY_RESEARCH_ROOT. Explicit builder --root/--project-root wins.
