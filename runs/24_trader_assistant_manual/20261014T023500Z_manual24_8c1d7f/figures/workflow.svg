<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="706" viewBox="0 0 1400 706">
<title>From observation to review</title>
<desc>Generic workflow · keep the plan and the execution record distinct</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9" fill="#65736b"/></marker></defs>
<rect width="1400" height="706" fill="#f4f2ec"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="54" y="66" font-size="42" fill="#253d35" font-weight="600" text-anchor="start">From observation to review</text>
<text x="54" y="113" font-size="26" fill="#65736b" font-weight="400" text-anchor="start">Generic workflow · keep the plan and the execution record distinct</text>
<rect x="54" y="206" width="228" height="190" rx="14" fill="#fffefa" stroke="#d2d8cd" stroke-width="2"/>
<circle cx="86" cy="245" r="16" fill="#16766f"/>
<text x="86" y="253" font-size="22" fill="#fffefa" font-weight="600" text-anchor="middle">1</text>
<text x="76" y="307" font-size="31" fill="#16766f" font-weight="600" text-anchor="start">Observe</text>
<text x="76" y="358" font-size="22" fill="#65736b" font-weight="400" text-anchor="start">Read the context</text>
<line x1="289" y1="302" x2="307" y2="302" stroke="#65736b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="312" y="206" width="228" height="190" rx="14" fill="#fffefa" stroke="#d2d8cd" stroke-width="2"/>
<circle cx="344" cy="245" r="16" fill="#253d35"/>
<text x="344" y="253" font-size="22" fill="#fffefa" font-weight="600" text-anchor="middle">2</text>
<text x="334" y="307" font-size="31" fill="#253d35" font-weight="600" text-anchor="start">Define plan</text>
<text x="334" y="358" font-size="22" fill="#65736b" font-weight="400" text-anchor="start">Set conditions</text>
<line x1="547" y1="302" x2="565" y2="302" stroke="#65736b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="570" y="206" width="228" height="190" rx="14" fill="#fffefa" stroke="#d2d8cd" stroke-width="2"/>
<circle cx="602" cy="245" r="16" fill="#16766f"/>
<text x="602" y="253" font-size="22" fill="#fffefa" font-weight="600" text-anchor="middle">3</text>
<text x="592" y="307" font-size="31" fill="#16766f" font-weight="600" text-anchor="start">Confirm</text>
<text x="592" y="358" font-size="22" fill="#65736b" font-weight="400" text-anchor="start">Check the setup</text>
<line x1="805" y1="302" x2="823" y2="302" stroke="#65736b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="828" y="206" width="228" height="190" rx="14" fill="#fffefa" stroke="#d2d8cd" stroke-width="2"/>
<circle cx="860" cy="245" r="16" fill="#b96739"/>
<text x="860" y="253" font-size="22" fill="#fffefa" font-weight="600" text-anchor="middle">4</text>
<text x="850" y="307" font-size="31" fill="#b96739" font-weight="600" text-anchor="start">Execute</text>
<text x="850" y="358" font-size="22" fill="#65736b" font-weight="400" text-anchor="start">Record the action</text>
<line x1="1063" y1="302" x2="1081" y2="302" stroke="#65736b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1086" y="206" width="228" height="190" rx="14" fill="#fffefa" stroke="#d2d8cd" stroke-width="2"/>
<circle cx="1118" cy="245" r="16" fill="#253d35"/>
<text x="1118" y="253" font-size="22" fill="#fffefa" font-weight="600" text-anchor="middle">5</text>
<text x="1108" y="307" font-size="31" fill="#253d35" font-weight="600" text-anchor="start">Review</text>
<text x="1108" y="358" font-size="22" fill="#65736b" font-weight="400" text-anchor="start">Compare to plan</text>
<rect x="54" y="459" width="745" height="118" rx="14" fill="#fffefa" stroke="#d2d8cd" stroke-width="2"/>
<rect x="824" y="459" width="516" height="118" rx="14" fill="#fffefa" stroke="#d2d8cd" stroke-width="2"/>
<text x="80" y="502" font-size="28" fill="#16766f" font-weight="600" text-anchor="start">Before execution</text>
<text x="80" y="546" font-size="25" fill="#65736b" font-weight="400" text-anchor="start">Planned levels can change as context changes.</text>
<text x="850" y="502" font-size="28" fill="#b96739" font-weight="600" text-anchor="start">After execution</text>
<text x="850" y="546" font-size="25" fill="#65736b" font-weight="400" text-anchor="start">Recorded execution stays fixed.</text>
<text x="54" y="652" font-size="25" fill="#65736b" font-weight="400" text-anchor="start">A general decision process; no indicator mechanics or entry rules are implied.</text>
</g></svg>
