<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="782" viewBox="0 0 1400 782">
<title>The position-sizing relationship</title>
<desc>A conceptual calculation · no numerical example or investment recommendation</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9" fill="#65736b"/></marker></defs>
<rect width="1400" height="782" fill="#f4f2ec"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="54" y="66" font-size="42" fill="#253d35" font-weight="600" text-anchor="start">The position-sizing relationship</text>
<text x="54" y="113" font-size="26" fill="#65736b" font-weight="400" text-anchor="start">A conceptual calculation · no numerical example or investment recommendation</text>
<rect x="54" y="189" width="773" height="373" rx="14" fill="#fffefa" stroke="#d2d8cd" stroke-width="2"/>
<rect x="963" y="274" width="377" height="214" rx="14" fill="#fffefa" stroke="#d2d8cd" stroke-width="2"/>
<text x="440" y="240" font-size="34" fill="#16766f" font-weight="600" text-anchor="middle">Cash risk budget</text>
<text x="440" y="294" font-size="25" fill="#65736b" font-weight="400" text-anchor="middle">planned cash-loss allowance</text>
<line x1="113" y1="331" x2="768" y2="331" stroke="#253d35" stroke-width="3"/>
<text x="440" y="388" font-size="34" fill="#b96739" font-weight="600" text-anchor="middle">Cash risk per unit</text>
<text x="440" y="443" font-size="28" fill="#253d35" font-weight="400" text-anchor="middle">entry-to-stop distance</text>
<text x="440" y="486" font-size="28" fill="#253d35" font-weight="400" text-anchor="middle">× cash value per price unit</text>
<text x="440" y="530" font-size="23" fill="#65736b" font-weight="400" text-anchor="middle">use the same currency as the risk budget</text>
<text x="894" y="397" font-size="57" fill="#65736b" font-weight="400" text-anchor="middle">=</text>
<text x="1151" y="359" font-size="35" fill="#253d35" font-weight="600" text-anchor="middle">Position size</text>
<text x="1151" y="416" font-size="28" fill="#65736b" font-weight="400" text-anchor="middle">in tradable units</text>
<text x="54" y="640" font-size="27" fill="#16766f" font-weight="600" text-anchor="start">Conceptual sizing · before fees/slippage</text>
<text x="54" y="688" font-size="25" fill="#65736b" font-weight="400" text-anchor="start">Tradable increments and instrument conventions still apply.</text>
<text x="54" y="734" font-size="25" fill="#65736b" font-weight="400" text-anchor="start">This relationship does not choose a risk budget, stop level, or trade.</text>
</g></svg>
