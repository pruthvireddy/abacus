[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reversal-study"
version = "0.1.0"
description = "Reproducible reversal-candle follow-through study for ATAS range exports"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
]

[project.scripts]
reversal-study = "reversal_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

