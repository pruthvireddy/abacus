[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "followthrough-adverse"
version = "0.1.0"
description = "Conditional adverse movement of the first follow-through candle after a Range XV reversal"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3"]

[project.scripts]
followthrough-adverse = "followthrough_adverse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

