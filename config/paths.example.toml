# Copy to paths.local.toml and set locations on your machine. Local paths are
# ignored by Git. Relative values resolve from the Abacus workspace root.
# publication_root is the project containing BOTH catalog/ and data/, not data/.
[paths]
publication_root = "../abacus-bhishma"
legacy_research_root = "../abacus-sahadeva"

# Optional overrides: ABACUS_WORKSPACE_ROOT, ABACUS_PUBLICATION_ROOT,
# ABACUS_LEGACY_RESEARCH_ROOT. Explicit builder --root/--project-root wins.
